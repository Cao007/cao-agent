name: cao-agent
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: production
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
      UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.13.5}
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://cao:${POSTGRES_PASSWORD:-cao}@db:5432/cao

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cao
      POSTGRES_USER: cao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cao}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cao -d cao"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: ["python", "-m", "backend.migrate"]
    depends_on:
      db:
        condition: service_healthy
  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.28-alpine}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
