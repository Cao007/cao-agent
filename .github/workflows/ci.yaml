name: checks
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cao
          POSTGRES_PASSWORD: cao
          POSTGRES_DB: cao_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cao -d cao_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://cao:cao@localhost:5432/cao_test
      TEST_DATABASE_URL: postgresql://cao:cao@localhost:5432/cao_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check backend examples
      - run: uv run ruff format --check backend examples
      - run: uv run python -m backend.migrate
      - run: uv run alembic check
      - run: uv run pytest -q
      - run: uv run python -m examples.human_review
      - uses: pnpm/action-setup@v4
        with:
          version: "10.29.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile --registry=https://registry.npmmirror.com
      - run: uv run python -m backend.export_openapi
      - run: pnpm --dir frontend generate:api
      - run: git diff --exit-code docs/openapi.json frontend/src/api/schema.d.ts
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: curl --fail http://localhost:8080/api/health
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
